name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:

  pre-commit_checks:
    runs-on: ubuntu-latest
    concurrency:
      group: pre-commit-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: 3.x

    - uses: asdf-vm/actions/setup@v4
    - name: Install asdf dependencies
      run: |
        asdf plugin add helm-docs https://github.com/sudermanjr/asdf-helm-docs.git
        asdf install

    - uses: pre-commit/action@v3.0.1
    - uses: pre-commit-ci/lite-action@v1.2.0
      if: always()
      with:
        msg: Apply automatic fixes

  lint:
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed on main)
        id: list-changed-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          changed=$(ct list-changed --config ct.yaml --since ${{ github.event.before }})
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi

      - name: Run chart-testing (list-changed for PR)
        id: list-changed-pr
        if: github.event_name == 'pull_request'
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add tieum https://tieum.github.io/helm-charts

      - name: Run chart-testing (lint on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ct lint --config ct.yaml --since ${{ github.event.before }} --check-version-increment=false

      - name: Run chart-testing (lint for PR)
        if: github.event_name == 'pull_request'
        run: ct lint --config ct.yaml

  discover-charts:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.discover.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Discover changed charts
        id: discover
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            changed=$(ct list-changed --config ct.yaml --since "${{ github.event.before }}")
          else
            changed=$(ct list-changed --config ct.yaml)
          fi
          if [[ -n "$changed" ]]; then
            charts=$(echo "$changed" | jq -R -s -c 'split("\n") | map(select(. != "")) | map(split("/") | last)')
          else
            charts="[]"
          fi
          echo "charts=$charts" >> "$GITHUB_OUTPUT"

  test:
    needs: [discover-charts]
    if: needs.discover-charts.outputs.charts != '[]'
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover-charts.outputs.charts) }}
        # https://endoflife.date/kubernetes and https://hub.docker.com/r/kindest/node/tags?page=1
        # Using currently supported K8s versions (N-2 support policy)
        kube_version: [1.32.11, 1.33.7, 1.34.3, 1.35.0]
        experimental: [false]
        # include:
        #   - kube_version: '1.36.0-alpha.0'
        #     experimental: true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    name: Test ${{ matrix.chart }} (K8s ${{ matrix.kube_version }})
    concurrency:
      group: test-${{ matrix.chart }}-${{ matrix.kube_version }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add tieum https://tieum.github.io/helm-charts

      - name: Create Kind Config
        run: |
          cat <<EOF > /tmp/kind.config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            image: "kindest/node:v${{ matrix.kube_version }}"
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          EOF

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          config: /tmp/kind.config.yaml

      - name: Deploy NGINX Ingress Controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s

      - name: Run chart-testing (install)
        run: ct install --config ct.yaml --charts charts/${{ matrix.chart }}

  test-status:
    if: always()
    needs: [discover-charts, test]
    runs-on: ubuntu-latest
    name: Test Status
    steps:
      - name: Check test results
        run: |
          result="${{ needs.test.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "Tests passed or were skipped (no charts changed)"
            exit 0
          fi
          echo "Tests failed with result: $result"
          exit 1

  kube-linter:
    runs-on: ubuntu-latest
    concurrency:
      group: kube-linter-${{ matrix.chart }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        chart:
          - adguard-home
          - atuin
          - dev-feed
          - ghost-export-to-s3
          - kresus
          - mac-oui
          - memos
          - networking-toolbox
          - ntfy
          - olivetin
          - open-terminal
          - service-names-port-numbers
          - wallos
          - web-check
          - wg-easy
    steps:
      - uses: actions/checkout@v7

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add tieum https://tieum.github.io/helm-charts

      - name: Scan '${{ matrix.chart }}' Chart with kube-linter
        uses: stackrox/kube-linter-action@v1.0.7
        continue-on-error: true
        with:
          directory: charts/${{ matrix.chart }}
          config: .kube-linter/config.yaml
          format: sarif
          output-file: ${{ matrix.chart }}.sarif
          #version: 0.5.0

      - name: Upload SARIF file
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: ${{ matrix.chart }}.sarif

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs:
      - lint
      - test-status
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        #with:
        #  version: v3.10.0

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add tieum https://tieum.github.io/helm-charts

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  update_gh-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs:
      - release
    concurrency:
      group: update_gh-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Sync README.md to gh-pages branch
        run: |
          git fetch
          git checkout -b gh-pages origin/gh-pages
          git pull --rebase
          git checkout origin/main README.md
          if [[ `git status --porcelain` ]]; then
            git commit -am "Sync README.md from origin/main"
            git push origin gh-pages
          fi
