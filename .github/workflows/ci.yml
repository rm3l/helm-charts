name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:

  pre-commit_checks:
    runs-on: ubuntu-latest
    concurrency:
      group: pre-commit-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: 3.x

    - uses: asdf-vm/actions/setup@v4
    - name: Install asdf dependencies
      run: |
        asdf plugin add helm-docs https://github.com/sudermanjr/asdf-helm-docs.git
        asdf install

    - uses: pre-commit/action@v3.0.1
    - uses: pre-commit-ci/lite-action@v1.2.0
      if: always()
      with:
        msg: Apply automatic fixes

  lint:
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed on main)
        id: list-changed-main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          changed=$(ct list-changed --config ct.yaml --since ${{ github.event.before }})
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi

      - name: Run chart-testing (list-changed for PR)
        id: list-changed-pr
        if: github.event_name == 'pull_request'
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add tieum https://tieum.github.io/helm-charts

      - name: Run chart-testing (lint on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ct lint --config ct.yaml --since ${{ github.event.before }} --check-version-increment=false

      - name: Run chart-testing (lint for PR)
        if: github.event_name == 'pull_request'
        run: ct lint --config ct.yaml

  discover-charts:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.discover.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Discover changed charts
        id: discover
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            changed=$(ct list-changed --config ct.yaml --since "${{ github.event.before }}")
          else
            changed=$(ct list-changed --config ct.yaml)
          fi
          if [[ -n "$changed" ]]; then
            charts=$(echo "$changed" | jq -R -s -c 'split("\n") | map(select(. != "")) | map(split("/") | last)')
          else
            charts="[]"
          fi
          echo "charts=$charts" >> "$GITHUB_OUTPUT"

  test:
    needs: [discover-charts]
    if: needs.discover-charts.outputs.charts != '[]'
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.discover-charts.outputs.charts) }}
        # https://hub.docker.com/r/kindest/node/tags
        kube_version: ['1.37.0']
    runs-on: ubuntu-latest
    name: Test ${{ matrix.chart }} (K8s ${{ matrix.kube_version }})
    concurrency:
      group: test-${{ matrix.chart }}-${{ matrix.kube_version }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add tieum https://tieum.github.io/helm-charts

      - name: Create Kind Config
        run: |
          cat <<EOF > /tmp/kind.config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            image: "kindest/node:v${{ matrix.kube_version }}"
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          EOF

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          config: /tmp/kind.config.yaml

      - name: Deploy NGINX Ingress Controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s

      - name: Run chart-testing (install)
        run: ct install --config ct.yaml --charts charts/${{ matrix.chart }}

  test-status:
    if: always()
    needs: [discover-charts, test]
    runs-on: ubuntu-latest
    name: Test Status
    steps:
      - name: Check test results
        run: |
          result="${{ needs.test.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "Tests passed or were skipped (no charts changed)"
            exit 0
          fi
          echo "Tests failed with result: $result"
          exit 1

  kube-linter:
    runs-on: ubuntu-latest
    concurrency:
      group: kube-linter-${{ matrix.chart }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      matrix:
        chart:
          - adguard-home
          - atuin
          - dev-feed
          - ghost-export-to-s3
          - kresus
          - mac-oui
          - memos
          - networking-toolbox
          - ntfy
          - olivetin
          - open-terminal
          - service-names-port-numbers
          - wallos
          - web-check
          - wg-easy
    steps:
      - uses: actions/checkout@v7

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add tieum https://tieum.github.io/helm-charts

      - name: Scan '${{ matrix.chart }}' Chart with kube-linter
        uses: stackrox/kube-linter-action@v1.0.7
        continue-on-error: true
        with:
          directory: charts/${{ matrix.chart }}
          config: .kube-linter/config.yaml
          format: sarif
          output-file: ${{ matrix.chart }}.sarif
          #version: 0.5.0

      - name: Upload SARIF file
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: ${{ matrix.chart }}.sarif

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs:
      - lint
      - test-status
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5
        #with:
        #  version: v3.10.0

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add tieum https://tieum.github.io/helm-charts

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.8.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  release_oci:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release_oci
      cancel-in-progress: false
    env:
      OCI_REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add tieum https://tieum.github.io/helm-charts

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push charts to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed_charts=()
          for chart_dir in charts/*/; do
            chart_name=$(basename "$chart_dir")
            chart_version=$(grep '^version:' "${chart_dir}Chart.yaml" | awk '{print $2}')

            echo "::group::${chart_name} ${chart_version}"

            # Build dependencies with retry; skip this chart on persistent failure
            dep_ok=false
            for attempt in 1 2 3; do
              if helm dependency build "$chart_dir" 2>&1; then
                dep_ok=true
                break
              fi
              echo "Dependency build attempt ${attempt} failed for ${chart_name}, retrying in 10s..."
              sleep 10
            done
            if [ "$dep_ok" = false ]; then
              echo "::warning::Skipping ${chart_name}: dependency build failed after 3 attempts"
              failed_charts+=("${chart_name}")
              echo "::endgroup::"
              continue
            fi

            helm package "$chart_dir" -d /tmp/helm-packages

            push_output=$(helm push "/tmp/helm-packages/${chart_name}-${chart_version}.tgz" "oci://${OCI_REGISTRY}" 2>&1) && push_rc=0 || push_rc=$?
            if [ $push_rc -ne 0 ]; then
              if echo "$push_output" | grep -qi "already exists"; then
                echo "Skipping ${chart_name}-${chart_version} (already exists in registry)"
              else
                echo "::error::Failed to push ${chart_name}-${chart_version}: ${push_output}"
                failed_charts+=("${chart_name}")
                echo "::endgroup::"
                continue
              fi
            fi

            # Ensure the GHCR package is public
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              /user/packages/container/${GITHUB_REPOSITORY#*/}%2F${chart_name}/visibility \
              -f visibility=public 2>/dev/null \
            || echo "::warning::Could not set visibility for ${chart_name} (may require manual action)"

            echo "::endgroup::"
          done

          if [ ${#failed_charts[@]} -ne 0 ]; then
            echo "::error::The following charts failed to publish: ${failed_charts[*]}"
            exit 1
          fi

      - name: Logout from GHCR
        if: always()
        run: helm registry logout ghcr.io

  update_gh-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs:
      - release
    concurrency:
      group: update_gh-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Sync README.md to gh-pages branch
        run: |
          git fetch
          git checkout -b gh-pages origin/gh-pages
          git pull --rebase
          git checkout origin/main README.md
          if [[ `git status --porcelain` ]]; then
            git commit -am "Sync README.md from origin/main"
            git push origin gh-pages
          fi
