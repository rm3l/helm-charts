# Slim image variant test
# Tests the slim image without multi-user or package installation

image:
  tag: "slim"

openTerminal:
  apiKey:
    value: "test-api-key-slim"

  # Multi-user and package installation not available in slim variant
  multiUser:
    enabled: false

  packages:
    apt: []
    pip: []

persistence:
  enabled: true
  size: 2Gi

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
