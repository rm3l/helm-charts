# Default values for open-terminal.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/open-webui/open-terminal
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # Image variants:
  #   - "latest" (~4GB): Full-featured with runtime package installation and multi-user mode support
  #   - "slim" (~430MB): Lightweight without runtime package installation or multi-user mode
  #   - "alpine" (~230MB): Minimal Alpine-based image
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# Note: Open Terminal doesn't expose a dedicated health endpoint, so we use tcpSocket probes
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Open Terminal specific configuration
openTerminal:
  # API Key configuration for authentication
  apiKey:
    # If not set, Open Terminal will auto-generate an API key on first startup
    # SECURITY WARNING: Only set this in values for development/testing.
    # For production, use existingSecret or let it auto-generate.
    value: ""
    # Use an existing secret for the API key
    # The secret must contain a key named "api-key"
    existingSecret: ""
    # Key name within the existing secret (default: api-key)
    existingSecretKey: "api-key"

  # Server configuration
  server:
    # Host address to bind to (default: 0.0.0.0)
    host: "0.0.0.0"
    # Port to listen on (default: 8000)
    port: 8000
    # Command execution timeout in seconds
    executeTimeout: ""

  # CORS configuration
  cors:
    # Allowed origins for CORS requests
    # Example: ["https://open-webui.example.com", "http://localhost:3000"]
    allowedOrigins: []

  # Multi-user mode configuration
  # IMPORTANT: Multi-user mode creates per-user Linux accounts with isolated home directories.
  # This is NOT production-grade for multi-tenant deployments - it's a lightweight convenience
  # feature for small, trusted groups. Only available in the "latest" image variant.
  multiUser:
    enabled: false

  # Runtime package installation
  # Only available in the "latest" image variant (~4GB)
  # Packages are installed at container startup
  packages:
    # APT packages to install (space-separated list)
    # Example: ["git", "curl", "vim"]
    apt: []
    # Python pip packages to install (space-separated list)
    # Example: ["requests", "pandas", "numpy"]
    pip: []

  # Logging configuration
  logging:
    # Directory for log files (optional)
    logDir: ""

  # SECURITY WARNING: Docker socket access
  # Mounting the Docker socket gives the container EFFECTIVELY ROOT ACCESS to the host.
  # Only enable this in fully trusted environments for AI agents that need to manage containers.
  # This feature requires elevated privileges and should NEVER be used in multi-tenant environments.
  docker:
    # Enable Docker socket access (default: false)
    enabled: false
    # Host path to Docker socket (default: /var/run/docker.sock)
    socketPath: "/var/run/docker.sock"

  # Configuration file (config.toml) settings
  # If enabled, creates a ConfigMap with the config.toml file
  config:
    # Enable custom configuration file
    enabled: false
    # Custom configuration content in TOML format
    # This will be mounted at /root/.config/open-terminal/config.toml
    content: |
      # Example configuration
      # [server]
      # host = "0.0.0.0"
      # port = 8000

# Persistence configuration
# Open Terminal stores user files and workspace data in /home/user
persistence:
  # Enable persistence for user data
  enabled: true
  # Existing PVC to use (if not set, a new PVC will be created)
  existingClaim: ""
  # Storage class for the PVC (if empty, uses default storage class)
  storageClass: ""
  # Access mode for the PVC
  accessMode: ReadWriteOnce
  # Size of the persistent volume
  size: 10Gi
  # Annotations for the PVC
  annotations: {}
